<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV History - PassAI</title>
    <link rel="stylesheet" href="resume-generator.css">
    <link rel="stylesheet" href="cv-history.css">
    <style>
        /* Inline critical styles to ensure layout works */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e5e5e5;
        }
        
        .layout-wrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 350px;
            min-width: 350px;
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            padding: 20px;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Simple 2-column flexbox layout -->
    <div class="layout-wrapper">
        <!-- LEFT: Sidebar with job list -->
        <div class="sidebar">
            <div class="header-inline">
                <h2 style="margin: 0 0 10px 0;">📄 CV History</h2>
                <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                    <button class="btn btn-sm btn-primary" onclick="openNewCVModal()">
                        📝 New CV
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="openSearchProfiles()">
                        👤 Profile
                    </button>
                </div>
            </div>
            
            <div style="border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; padding-bottom: 12px;">
                <h3 style="margin: 0; font-size: 1rem">Jobs <span id="jobs-count" class="badge" style="margin-left: 8px;">0</span></h3>
            </div>
            
            <div id="job-list">
                <!-- Jobs loaded here -->
            </div>
        </div>
        
        <!-- RIGHT: Main content area -->
        <div class="main-content">
            <!-- Empty state when no job selected -->
            <div id="no-selection" class="empty-state-main">
                <div style="font-size: 4rem; opacity: 0.5;">📋</div>
                <h2 style="color: #9ca3af">Select a job from the sidebar</h2>
                <p style="color: #6b7280">Click on a job to see all CV variants</p>
            </div>

            <!-- Job panel when selected -->
            <div id="job-panel" class="hidden">
                <div class="panel-header">
                    <div>
                        <h1 id="job-title" style="margin: 0 0 8px 0; font-size: 1.5rem"></h1>
                        <p id="job-company" style="margin: 0; color: #a855f7; font-size: 1rem"></p>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        <span id="variants-badge" class="stat-badge">0 CVs</span>
                        <span id="score-badge" class="stat-badge score">Best: 0</span>
                    </div>
                </div>

                <div class="action-bar">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button id="btn-generate-more" class="btn btn-primary" onclick="generateMoreVariants()">
                            🔄 Generate More
                        </button>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="range" id="variant-count" min="1" max="10" value="3" 
                                   oninput="document.getElementById('count-display').textContent = this.value"
                                   style="width: 100px; cursor: pointer;">
                            <span id="count-display" style="color: #e2e8f0; font-weight: 700; min-width: 20px; text-align: center;">3</span>
                            <span style="color: #64748b; font-size: 0.875rem;">CV(s)</span>
                        </div>
                    </div>
                    <button id="btn-generate-first" class="btn btn-primary hidden" onclick="generateFirstCV()">
                        🚀 Generate CV
                    </button>
                    <span id="generate-status" style="color: #f59e0b; margin-left: 16px;"></span>
                </div>

                <div id="variants-grid" class="variants-grid">
                    <!-- Variants loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (unchanged) -->
    <div id="new-cv-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeNewCVModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generate New CV</h2>
                <button class="modal-close" onclick="closeNewCVModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="input-tabs">
                    <button class="tab active" onclick="switchNewCVTab('text')">📝 Text</button>
                    <button class="tab" onclick="switchNewCVTab('url')">🔗 URL</button>
                </div>
                <div class="tab-content active" id="new-cv-tab-text">
                    <textarea id="new-cv-job-text" placeholder="Paste job description..." rows="10" style="width: 100%;"></textarea>
                </div>
                <div class="tab-content" id="new-cv-tab-url">
                    <input type="url" id="new-cv-job-url" placeholder="https://linkedin.com/jobs/..." style="width: 100%;" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeNewCVModal()">Cancel</button>
                <button class="btn btn-primary" onclick="extractAndGenerateCV()">Extract & Generate</button>
            </div>
        </div>
    </div>

    <div id="preview-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closePreviewModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">CV Preview</h2>
                <button class="modal-close" onclick="closePreviewModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePreviewModal()">Close</button>
                <button id="modal-download-btn" class="btn btn-primary">💾 Download</button>
            </div>
        </div>
    </div>

    <script>
        function openSearchProfiles() {
            if (window.electronAPI?.send) {
                window.electronAPI.send('open-search-profiles');
            }
        }
        function openNewCVModal() {
            document.getElementById('new-cv-modal').classList.remove('hidden');
        }
        function closeNewCVModal() {
            document.getElementById('new-cv-modal').classList.add('hidden');
        }
        function switchNewCVTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('hidden'));
            document.getElementById(`new-cv-tab-${tab}`).classList.remove('hidden');
        }
        function closePreviewModal() {
            document.getElementById('preview-modal').classList.add('hidden');
        }
    </script>
    
    <script src="resume-generator.js"></script>
</body>
</html>
