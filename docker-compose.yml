version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: passai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: passai
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - passai-network

networks:
  passai-network:
    driver: bridge
