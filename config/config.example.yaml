# LLM Configuration
llm:
  default_provider: local  # local | openai | anthropic | google
  
  local:
    engine: ollama  # ollama | llama-cpp | lm-studio
    endpoint: http://localhost:11434
    model: llama3.1:8b-instruct-q4_K_M
    timeout: 2.0  # seconds
    max_tokens: 150
    temperature: 0.7
    
  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    timeout: 5.0
    max_tokens: 150
    temperature: 0.7
    
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-3-haiku-20240307
    timeout: 5.0
    max_tokens: 150
    temperature: 0.7
  
  fallback:
    enabled: true
    strategy: local -> openai -> anthropic

# Audio Configuration
audio:
  sample_rate: 16000
  channels: 1
  chunk_duration_ms: 30
  
  vad:
    enabled: true
    mode: 3  # 0-3, 3 = most aggressive
    min_speech_duration_ms: 300
    max_speech_gap_ms: 800
  
  noise_reduction:
    enabled: true
    calibration_duration: 2.0  # seconds

# ASR Configuration
asr:
  engine: faster-whisper  # faster-whisper | deepgram | azure
  
  faster_whisper:
    model_size: large-v3  # tiny | base | small | medium | large-v3
    device: cuda  # cuda | cpu
    compute_type: int8  # int8 | float16 | float32
    language: pt  # null = auto-detect
    beam_size: 5
    vad_filter: true
    word_timestamps: true
  
  deepgram:
    api_key: ${DEEPGRAM_API_KEY}
    model: nova-2
    language: pt-BR

# Screen Capture Configuration
screen:
  enabled: true
  monitor: 1  # Primary monitor
  capture_interval: 3.0  # seconds
  change_threshold: 0.15  # 15% pixel difference
  max_resolution: [1920, 1080]
  
  ocr:
    enabled: true
    engine: tesseract  # tesseract | easyocr
    languages: por+eng
    confidence_threshold: 30  # 0-100
    preprocessing: true

# Objection Detection Configuration
objection_detection:
  enabled: true
  model: distilbert-base-uncased  # Path or HF model
  confidence_threshold: 0.6
  
  types:
    - price
    - authority
    - trust
    - priority
    - risk
    - comparison

# Persuasion Engine Configuration
persuasion:
  max_response_length: 300  # characters
  tone: confident  # confident | technical | empathetic
  include_alternatives: true
  max_alternatives: 2

# Context Manager Configuration
context:
  sliding_window_size: 10  # messages
  max_history_minutes: 60
  summarize_old_history: true

# UI Configuration
ui:
  framework: pyqt6  # pyqt6 | electron
  
  overlay:
    width: 400
    height: 250
    position: bottom-right  # top-left | top-right | bottom-left | bottom-right
    transparency: 0.95
    always_on_top: true
    
  hotkeys:
    toggle_visibility: Ctrl+Shift+A
    refresh: Ctrl+Shift+R
    close: Escape
    copy_suggestion: Ctrl+Shift+C

# Privacy & Security Configuration
privacy:
  save_history: false
  encryption_enabled: true
  encryption_key: ${ENCRYPTION_KEY}  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  
  compliance_mode: false  # Disable cloud LLMs
  audit_logs: false

# Performance Configuration
performance:
  max_latency_ms: 1000
  enable_caching: true
  cache_size: 100
  
  profiling:
    enabled: false
    log_file: logs/profiling.log

# Logging Configuration
logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/ai-copilot.log
  max_size_mb: 10
  backup_count: 5

# Telemetry Configuration (Opt-in)
telemetry:
  enabled: false
  anonymize: true
  endpoint: null
